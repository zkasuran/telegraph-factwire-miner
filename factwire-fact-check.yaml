version: "1"
kind: miner
id: 7420
slug: factwire-fact-check
protocol: generic
name: FactWire Fact Check
description: >
  Fact checking for a claim, answered by a language model at request time. Send the claim or
  the whole question and the miner returns a one word verdict (True, False, Partly true or
  Unverifiable) followed by one or two sentences of the correct facts that settle it, covering
  exactly what the claim asserts. The answer is produced with MiniMax under a commercial plan
  held by the operator, so this miner is not keyless. Serves the FACT_CHECK intent.
base_url: https://telegraph-fact.margyn.workers.dev

docs:
  documentation: https://telegraph-fact.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: claim is the statement to check or the whole question. A single claim, not a batch.
    param: claim
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example 'Is it true that ...'. The
        miner reads the claim from it, so passing the whole question works as well as passing
        the claim on its own.
    claim:
      type: string
      description: The statement whose truth should be checked.

output_schema:
  type: object
  properties:
    verdict:
      type: string
      description: The verdict in short form, True, False, Partly true or Unverifiable.
    summary:
      type: string
      description: The verdict followed by one or two sentences of the correct facts that settle the claim.
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /fact-check
    external_path: /fact-check
    method: GET
    description: >
      Fact check for one claim, the claim as a query parameter (?claim=...). Also accepts a
      whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - FACT_CHECK

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: verdict
        description: The verdict in short form.
        source_path: verdict
      - index: 1
        name: summary
        description: The verdict plus the correct facts that settle the claim.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: fact-check
      method: GET
      query_params:
        claim: { source: strings.1 }
